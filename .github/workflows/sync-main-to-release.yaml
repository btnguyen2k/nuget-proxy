# Open a reviewable back-sync PR only after a published release reaches main.
# Remove the merged sync branch without touching tags or releases.
name: 'sync-main-to-release'

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

permissions:
  contents: read

env:
  BRANCH_TO_RELEASE: 'release' # Keep synchronized with release.yaml.

jobs:
  SyncRelease:
    # Keep the prefix synchronized with env.SYNC_BRANCH_PREFIX in release.yaml.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-sync/')
    runs-on: ubuntu-latest
    concurrency:
      group: sync-main-to-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create main-to-release PR if needed
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.payload.pull_request.base.ref;
            const base = process.env.BRANCH_TO_RELEASE;

            const { data: comparison } =
              await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${base}...${head}`
              });

            if (comparison.ahead_by === 0) {
              console.log(`ℹ️${base} already contains ${head}.`);
              return;
            }

            const { data: existingPulls } =
              await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${head}`,
                base,
                per_page: 100
              });

            if (existingPulls.length > 0) {
              console.log(`ℹ️Using existing back-sync PR: ${existingPulls[0].html_url}`);
              return;
            }

            const { data: pullRequest } =
              await github.rest.pulls.create({
                owner,
                repo,
                title: `Sync ${head} back into ${base}`,
                body: [
                  `Sync ${head} back into ${base} after ${context.payload.pull_request.html_url} merged.`,
                  '',
                  '**Merge this PR with a merge commit, not squash or rebase, to preserve branch history.**',
                  '',
                  `Resolve conflicts without discarding newer work or release instructions on ${base}.`,
                  'This workflow does not merge the PR or reset either branch.',
                  '',
                  'History-only merges do not start another release. Content changes queue a normal release check.'
                ].join('\n'),
                head,
                base,
                maintainer_can_modify: false
              });

            console.log(`✅Created back-sync PR: ${pullRequest.html_url}`);

  CleanupSyncBranch:
    # Cleanup must not be coalesced with another release's back-sync PR creation.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-sync/')
    runs-on: ubuntu-latest
    concurrency:
      group: cleanup-release-sync-${{ github.repository }}-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Remove merged sync branch if present
        env:
          SYNC_BRANCH: ${{ github.event.pull_request.head.ref }}
          SYNC_COMMIT: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          SYNC_REF="refs/heads/${SYNC_BRANCH}"

          if [[ "${SYNC_BRANCH}" != release-sync/* ]] ||
             [[ ! "${SYNC_COMMIT}" =~ ^[0-9a-f]{40}$ ]] ||
             ! git check-ref-format "${SYNC_REF}"; then
            echo "❌Invalid sync branch or commit."
            exit 1
          fi

          remote_sync_sha() {
            git ls-remote --heads origin "${SYNC_REF}" | awk '{print $1}'
          }

          REMOTE_SYNC=$(remote_sync_sha)

          if [ -z "${REMOTE_SYNC}" ]; then
            echo "ℹ️Merged sync branch is already removed."
            exit 0
          fi

          if [ "${REMOTE_SYNC}" != "${SYNC_COMMIT}" ]; then
            echo "❌Sync branch moved to ${REMOTE_SYNC}; refusing to delete it."
            exit 1
          fi

          if ! git push \
               --force-with-lease="${SYNC_REF}:${SYNC_COMMIT}" \
               origin \
               ":${SYNC_REF}"; then
            REMOTE_SYNC=$(remote_sync_sha)

            if [ -z "${REMOTE_SYNC}" ]; then
              echo "ℹ️Merged sync branch is already removed."
              exit 0
            fi

            echo "❌Could not delete sync branch at ${REMOTE_SYNC}."
            exit 1
          fi

          echo "✅Removed merged sync branch."
